name: Update profile cards

on:
  schedule:
    - cron: '17 3 * * *' # daily, 06:17 in Nairobi (cron runs in UTC)
  workflow_dispatch: # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update.yml']

permissions:
  contents: write # lets the job push the regenerated SVGs

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate cards
        env:
          # PROFILE_TOKEN is optional: a personal access token lets private contributions show up.
          # Without it the built-in GITHUB_TOKEN reads public data, which is enough for everything else.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/generate.mjs

      - name: Commit if anything changed
        run: |
          git add assets data
          if git diff --cached --quiet; then
            echo "Cards unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile cards"
          git push
