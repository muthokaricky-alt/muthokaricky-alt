<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-labelledby="t">
<title id="t">34 public repositories. Also worth a look: QR Studio, Schedulix, NexusLS, Budget Tracker, MyBlock, TicTacToe.</title>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#1a7f37" stop-opacity="0.6"/>
  <stop offset=".45" stop-color="#7c3aed" stop-opacity="0.35"/>
  <stop offset="1" stop-color="#d0d7de"/>
</linearGradient>
<radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(231.00000000000003 207)">
  <stop offset="0" stop-color="#1a7f37" stop-opacity="0.08"/><stop offset="1" stop-color="#1a7f37" stop-opacity="0"/>
</radialGradient>
