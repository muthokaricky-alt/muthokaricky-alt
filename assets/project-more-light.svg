<rect width="40" height="40" rx="11" fill="url(#tile)"/>
<g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#ffffff"><rect x="11" y="11" width="7" height="7" rx="2"/><rect x="22" y="11" width="7" height="7" rx="2"/><rect x="11" y="22" width="7" height="7" rx="2"/><rect x="22" y="22" width="7" height="7" rx="2"/></g>
