<style>
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.fi{animation:fi .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.pulse{opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 2.6s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.8)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="419" height="229" rx="16" fill="#ffffff"/>
<rect x=".5" y=".5" width="419" height="229" rx="16" fill="url(#glowA)"/>
<rect x=".5" y=".5" width="419" height="229" rx="16" fill="url(#glowB)"/>
<rect x=".5" y=".5" width="419" height="229" rx="16" fill="none" stroke="url(#edge)"/>
<g class="fi">
